[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-gateway"
version = "0.1.0"
description = "Public reference implementation of Quantum Gateway"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "quantum_gateway",
    "quantum_gateway.*",
    "jnka",
    "jnka.*",
]

[tool.black]
target-version = ["py313"]
line-length = 88
